[project]
name = "diemdanh-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "psycopg[binary,pool]",
  "alembic",
  "sqlalchemy",
  "pydantic",
  "pyyaml",
  "argon2-cffi",
  "pyjwt",
  "python-dotenv",
  "cryptography",
  "numpy",
  "onnxruntime",
  "opencv-python-headless",  # máy dev cài thêm opencv-python để spike_face.py mở được cửa sổ webcam
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "pgserver"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
