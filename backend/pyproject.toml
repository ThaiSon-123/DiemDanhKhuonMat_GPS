[project]
name = "diemdanh-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "psycopg[binary,pool]",
  "alembic",
  "sqlalchemy",
  "pydantic",
  "pyyaml",
  "argon2-cffi",
  "pyjwt",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "pgserver"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
